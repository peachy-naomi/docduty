services:
  api:
    build: ./api
    ports:
      - "8200:8200"
    environment:
      - DOCDUTY_PG_HOST=host.docker.internal
      - DOCDUTY_PG_PORT=5433
      - DOCDUTY_DB=docduty
      - DOCDUTY_PG_USER=peachi
      - DOCDUTY_PG_PASSWORD=00024680Ab*
      - JWT_SECRET=change_this_to_something_long_and_random_later
      - DOCDUTY_RESEND_API_KEY=${DOCDUTY_RESEND_API_KEY}
      - APP_BASE_URL=http://localhost:8200
      - APP_FRONTEND_URL=http://localhost:3003
      - DOCDUTY_PAYSTACK_SECRET_KEY=${DOCDUTY_PAYSTACK_SECRET_KEY}
      - DOCDUTY_INDIVIDUAL_PLAN_CODE=${DOCDUTY_INDIVIDUAL_PLAN_CODE}
      - DOCDUTY_AGENCY_PLAN_CODE=${DOCDUTY_AGENCY_PLAN_CODE}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8200
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3003:3000"
    depends_on:
      - api
